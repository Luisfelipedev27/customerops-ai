name: customerops
x-app: &app
  build: .
  environment:
    DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://customerops:customerops_dev@db:5432/customerops}
    REDIS_URL: redis://redis:6379/0
    OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    AI_MODE: ${AI_MODE:-demo}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://127.0.0.1:8000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    INPUT_USD_PER_MILLION: ${INPUT_USD_PER_MILLION:-0}
    OUTPUT_USD_PER_MILLION: ${OUTPUT_USD_PER_MILLION:-0}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: customerops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customerops_dev}
      POSTGRES_DB: customerops
    ports: ['127.0.0.1:5434:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U customerops -d customerops']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6381:6379']
    volumes: ['redisdata:/data']
    command: ['redis-server','--appendonly','yes']
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *app
    command: ['uv','run','--no-sync','alembic','upgrade','head']
    environment:
      DATABASE_URL: ${CONTAINER_MIGRATION_DATABASE_URL:-postgresql+psycopg://customerops:customerops_dev@db:5432/customerops}
    restart: 'no'
  api:
    <<: *app
    command: ['uv','run','--no-sync','uvicorn','customerops_ai.api:app','--host','0.0.0.0','--port','8000']
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD','/app/.venv/bin/python','-c',"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: ['uv','run','--no-sync','celery','-A','customerops_ai.jobs:celery_app','worker','--loglevel=INFO','--concurrency=2']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    profiles: ['observability']
    environment: {COLLECTOR_OTLP_ENABLED: 'true'}
    ports: ['127.0.0.1:16686:16686','127.0.0.1:4318:4318']
volumes:
  pgdata:
    name: customerops_pgdata
  redisdata:
