name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: customerops
          POSTGRES_PASSWORD: customerops_test
          POSTGRES_DB: customerops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U customerops -d customerops_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://customerops:customerops_test@localhost:5432/customerops_test
      TEST_DATABASE_URL: postgresql+psycopg://customerops:customerops_test@localhost:5432/customerops_test
      REDIS_URL: redis://localhost:6379/0
      TEST_RUNTIME_ROLE: customerops_test_runtime
      RUNTIME_DATABASE_USER: customerops_test_runtime
      RUNTIME_DATABASE_PASSWORD: customerops-test-runtime-password
      AI_MODE: demo
      DEMO_PASSWORD: customerops-test-password
      ALLOWED_ORIGIN: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1', python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --frozen
      - run: make lint
      - run: uv run alembic upgrade head
      - run: uv run python scripts/provision_runtime.py
      - run: uv run python -m customerops_ai.seed
      - run: uv run pytest -q
      - run: uv run python -m customerops_ai.evals
      - run: npm ci && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
